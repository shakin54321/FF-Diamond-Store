<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0fdf4">
<title>Processing Order | FF Diamond</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f7fff9 0%,#e8f8ed 48%,#f5fff7 100%);color:#153b25}
.panel{width:min(100%,430px);text-align:center;padding:42px 26px 38px;border:1px solid #d5f0dc;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 22px 65px rgba(28,110,55,.12)}
.mark{width:88px;height:88px;margin:0 auto 27px;position:relative;display:grid;place-items:center}
.ring{position:absolute;inset:0;border:4px solid #dcfce7;border-top-color:#16a34a;border-right-color:#4ade80;border-radius:50%;animation:spin 1s linear infinite}
.core{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#dcfce7,#bbf7d0);color:#15803d}
.core svg{width:29px;height:29px}
h1{font-size:23px;letter-spacing:-.45px;margin:0 0 11px;font-weight:750;color:#166534}
p{margin:0;color:#52715c;font-size:14px;line-height:1.75}
.track{height:6px;background:#dcfce7;border-radius:9px;overflow:hidden;margin:28px 0 13px}
.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#86efac);border-radius:9px;animation:progress 6s linear forwards}
.note{font-size:12px;color:#73917b}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes progress{to{width:100%}}
@media(prefers-reduced-motion:reduce){.ring{animation-duration:3s}.track span{animation-duration:6s}}
</style>
</head>
<body>
<main class="panel" role="status" aria-live="polite">
  <div class="mark"><div class="ring"></div><div class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div></div>
  <h1>Preparing Your Order</h1>
  <p>আপনার অর্ডার প্রস্তুত করা হচ্ছে। অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন।</p>
  <div class="track"><span></span></div>
  <div class="note">Please keep this page open</div>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const target=new URL('Payment.html',location.href);
 for(const key of ['diamonds','price']){const value=params.get(key);if(value!==null)target.searchParams.set(key,value);}
 setTimeout(()=>location.replace(target.toString()),6000);
})();
</script>
</body>
</html>
